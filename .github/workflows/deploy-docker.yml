# GitHub Actions 工作流 - Docker 自动部署
# 推送到 main 分支时自动构建并部署到腾讯云服务器

name: Deploy to Tencent Cloud (Docker)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-docker.yml'
  workflow_dispatch:  # 允许手动触发

# 设置权限
permissions:
  contents: read

# 环境变量
env:
  DOCKER_IMAGE_NAME: job-ai-backend
  DOCKER_CONTAINER_NAME: job-ai-backend

jobs:
  # ==================== 构建验证阶段 ====================
  build-and-test:
    name: 构建并测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ==================== 后端构建验证 ====================
      - name: 设置 Node.js (后端)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        working-directory: ./backend
        run: npm ci

      - name: 类型检查 - 后端
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: 构建后端
        working-directory: ./backend
        run: |
          npm run prisma:generate
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ==================== 前端构建验证 ====================
      - name: 设置 Node.js (前端)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: ./web
        run: npm ci

      - name: 类型检查 - 前端
        working-directory: ./web
        run: npm run type-check

      - name: 构建前端
        working-directory: ./web
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend/dist/
            web/dist/
          retention-days: 1

  # ==================== 部署到服务器 ====================
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build-and-test  # 确保构建成功后才部署
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      # ==================== 部署后端 (Docker) ====================
      - name: 部署后端服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true  # 遇到错误立即停止
          envs: |
            DOCKER_IMAGE_NAME
            DOCKER_CONTAINER_NAME
          script: |
            set -e

            echo "=========================================="
            echo "开始部署后端服务 (Docker)"
            echo "=========================================="
            echo ""

            # 进入项目目录
            cd /var/www/job-ai

            # 拉取最新代码
            echo "📥 拉取最新代码..."
            git fetch origin
            git reset --hard origin/main

            # 停止并删除旧容器
            echo "🛑 停止旧容器..."
            if [ "$(docker ps -aq -f name=$DOCKER_CONTAINER_NAME)" ]; then
                docker stop $DOCKER_CONTAINER_NAME 2>/dev/null || true
                docker rm $DOCKER_CONTAINER_NAME 2>/dev/null || true
            fi

            # 删除旧镜像
            echo "🗑️ 清理旧镜像..."
            docker rmi $DOCKER_IMAGE_NAME:old 2>/dev/null || true
            docker tag $DOCKER_IMAGE_NAME:latest $DOCKER_IMAGE_NAME:old 2>/dev/null || true

            # 构建新镜像
            echo "🔨 构建新镜像..."
            docker build -t $DOCKER_IMAGE_NAME:latest -f backend/Dockerfile .

            # 启动新容器
            echo "🚀 启动新容器..."
            docker run -d \
                --name $DOCKER_CONTAINER_NAME \
                --restart unless-stopped \
                -p 3001:3001 \
                --env-file /var/www/job-ai/backend/.env \
                --health-cmd "node -e \"require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\"" \
                --health-interval 30s \
                --health-timeout 10s \
                --health-retries 3 \
                --health-start-period 40s \
                $DOCKER_IMAGE_NAME:latest

            echo "✅ 后端容器启动成功！"
            echo ""

            # 等待容器启动
            echo "⏳ 等待容器启动..."
            sleep 15

            # 检查容器状态
            echo "📊 容器状态："
            docker ps -f name=$DOCKER_CONTAINER_NAME

            echo ""

            # 数据库迁移
            echo "💾 执行数据库迁移..."
            docker exec $DOCKER_CONTAINER_NAME npx prisma db push || echo "⚠️ 数据库迁移跳过或失败"

            echo "✅ 后端部署完成！"
            echo ""

      # ==================== 部署前端 ====================
      - name: 部署前端服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "=========================================="
            echo "开始部署前端服务"
            echo "=========================================="
            echo ""

            cd /var/www/job-ai/web

            # 安装依赖
            echo "📦 安装依赖..."
            npm ci

            # 构建生产版本
            echo "🏗️ 构建生产版本..."
            npm run build

            echo "✅ 前端部署完成！"
            echo ""

  # ==================== 健康检查 ====================
  health-check:
    name: 健康检查
    runs-on: ubuntu-latest
    needs: deploy  # 等待部署完成
    timeout-minutes: 5

    steps:
      - name: 等待服务启动
        run: sleep 20

      - name: 检查后端健康状态
        run: |
          echo "🔍 检查后端健康状态..."

          # 使用内网 IP 检查（如果配置了）
          BACKEND_URL="http://${{ secrets.SERVER_HOST }}:3001/api/health"

          max_attempts=5
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL || echo "000")

            if [ "$response" = "200" ]; then
              echo "✅ 后端服务正常 (HTTP 200)"
              curl -s $BACKEND_URL | jq '.'
              exit 0
            fi

            attempt=$((attempt + 1))
            echo "⏳ 第 $attempt 次检查失败 (HTTP $response)，等待后重试..."
            sleep 5
          done

          echo "❌ 后端服务健康检查失败"
          exit 1

      - name: 检查 Docker 容器状态
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "📊 Docker 容器状态："
            docker ps -f name=$DOCKER_CONTAINER_NAME

            echo ""
            echo "📋 容器日志（最近 20 行）："
            docker logs --tail 20 $DOCKER_CONTAINER_NAME

      - name: 部署成功通知
        if: success()
        run: |
          echo "=========================================="
          echo "🎉 部署成功！"
          echo "=========================================="
          echo ""
          echo "📱 前端地址: https://${{ secrets.DOMAIN }}"
          echo "🔧 后端地址: https://${{ secrets.DOMAIN }}/api/health"
          echo ""

  # ==================== 回滚（失败时） ====================
  rollback:
    name: 回滚到上一版本
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: failure()  # 任何步骤失败时触发
    timeout-minutes: 10

    steps:
      - name: 执行回滚
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "⚠️ 部署失败，开始回滚..."
            cd /var/www/job-ai

            # 停止当前容器
            docker stop $DOCKER_CONTAINER_NAME 2>/dev/null || true
            docker rm $DOCKER_CONTAINER_NAME 2>/dev/null || true

            # 恢复旧镜像
            if [ "$(docker images -q $DOCKER_IMAGE_NAME:old)" ]; then
              echo "🔄 恢复旧镜像..."
              docker tag $DOCKER_IMAGE_NAME:old $DOCKER_IMAGE_NAME:latest

              # 启动旧容器
              docker run -d \
                  --name $DOCKER_CONTAINER_NAME \
                  --restart unless-stopped \
                  -p 3001:3001 \
                  --env-file /var/www/job-ai/backend/.env \
                  $DOCKER_IMAGE_NAME:latest

              echo "✅ 回滚完成"
            else
              echo "⚠️ 没有找到旧镜像，无法回滚"
            fi
