name: Deploy to Production (Tencent Cloud)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

jobs:
  # 健康检查
  health-check:
    name: 健康检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 等待服务启动
        run: sleep 20

      - name: 检查后端
        run: |
          BACKEND_URL="https://job.100million.top/api/health"
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ 后端服务正常"
              exit 0
            fi
            echo "⏳ 第 $i 次检查失败，重试..."
            sleep 5
          done
          echo "❌ 后端服务异常"
          exit 1

      - name: 检查前端
        run: |
          FRONTEND_URL="https://job.100million.top"
          response=$(curl -s -o /dev/null -w "%{http_code}" $FRONTEND_URL || echo "000")
          if [ $response = "200" ] || [ $response = "301" ] || [ $response = "302" ]; then
            echo "✅ 前端服务正常"
          else
            echo "❌ 前端服务异常 (HTTP $response)"
            exit 1
          fi

  # 部署后端
  deploy-backend:
    name: 部署后端服务
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            echo "========== 开始部署后端服务 =========="
            cd /var/www/job-ai

            echo "📥 拉取最新镜像..."
            docker compose pull backend

            echo "🔄 启动后端服务..."
            docker compose up -d backend

            echo "⏳ 等待服务启动..."
            sleep 10

            echo "✅ 后端服务部署完成！"
            docker compose ps backend

  # 部署前端
  deploy-frontend:
    name: 部署前端服务
    runs-on: ubuntu-latest
    needs: deploy-backend
    timeout-minutes: 10

    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            echo "========== 开始部署前端服务 =========="
            cd /var/www/job-ai

            echo "📥 拉取最新镜像..."
            docker compose pull frontend

            echo "🔄 启动前端服务..."
            docker compose up -d frontend

            echo "⏳ 等待服务启动..."
            sleep 5

            echo "✅ 前端服务部署完成！"
            docker compose ps frontend
