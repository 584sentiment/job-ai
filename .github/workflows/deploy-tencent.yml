name: 自动部署到腾讯云服务器

on:
  push:
    branches:
      - main  # 推送到 main 分支时触发部署
  workflow_dispatch:  # 允许手动触发部署

jobs:
  # 后端部署
  deploy-backend:
    name: 部署后端服务
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署后端到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false  # 遇到错误继续执行，以便看到完整日志
          script: |
            set -e

            echo "========== 开始部署后端服务 =========="
            cd /var/www/job-ai

            # 拉取最新代码
            echo "📥 拉取最新代码..."
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            # 进入后端目录
            cd backend

            # 创建 .env 文件（如果不存在）
            if [ ! -f .env ]; then
              echo "🔧 创建 .env 文件..."
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
              echo "PORT=8080" >> .env
              echo "NODE_ENV=production" >> .env
              echo "LOG_LEVEL=info" >> .env
              echo "CORS_ORIGIN=https://yourdomain.com,https://www.yourdomain.com" >> .env
              echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
            fi

            # 安装依赖
            echo "📦 安装依赖..."
            npm ci --production=false

            # 生成 Prisma Client
            echo "🔨 生成 Prisma Client..."
            npm run prisma:generate

            # 推送数据库 schema（生产环境）
            echo "💾 推送数据库 schema..."
            npm run prisma:push

            # 构建项目
            echo "🏗️ 构建项目..."
            npm run build

            # 重启或启动 PM2 服务
            echo "🔄 重启后端服务..."
            if pm2 describe job-ai-backend > /dev/null 2>&1; then
              pm2 restart job-ai-backend
            else
              pm2 start dist/index.js --name job-ai-backend
            fi

            # 保存 PM2 进程列表
            pm2 save

            echo "✅ 后端服务部署完成！"
            pm2 status

  # 前端部署
  deploy-frontend:
    name: 部署前端服务
    runs-on: ubuntu-latest
    needs: deploy-backend  # 等待后端部署完成
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署前端到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          script: |
            set -e

            echo "========== 开始部署前端服务 =========="
            cd /var/www/job-ai/web

            # 安装依赖
            echo "📦 安装依赖..."
            npm ci

            # 构建项目
            echo "🏗️ 构建项目..."
            npm run build

            # 设置文件权限
            echo "🔐 设置文件权限..."
            sudo chown -R www-data:www-data dist/
            sudo chmod -R 755 dist/

            # 重载 Nginx
            echo "🔄 重载 Nginx..."
            sudo systemctl reload nginx

            echo "✅ 前端服务部署完成！"

  # 健康检查
  health-check:
    name: 健康检查
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    timeout-minutes: 5

    steps:
      - name: 等待服务启动
        run: sleep 15

      - name: 检查后端 API
        run: |
          echo "🔍 检查后端健康状态..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}:8080/api/health)
          if [ $response -eq 200 ]; then
            echo "✅ 后端服务正常"
          else
            echo "❌ 后端服务异常 (HTTP $response)"
            exit 1
          fi

      - name: 检查前端服务
        run: |
          echo "🔍 检查前端服务..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}/)
          if [ $response -eq 200 ] || [ $response -eq 301 ] || [ $response -eq 302 ]; then
            echo "✅ 前端服务正常"
          else
            echo "❌ 前端服务异常 (HTTP $response)"
            exit 1
          fi

      - name: 检查 PM2 进程
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "📊 PM2 进程状态："
            pm2 status

      - name: 部署成功
        run: |
          echo "🎉 部署成功！"
          echo "📱 前端地址: http://${{ secrets.SERVER_HOST }}/"
          echo "🔧 后端地址: http://${{ secrets.SERVER_HOST }}:8080/api/health"
