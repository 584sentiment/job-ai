version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-ai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      # 其他环境变量
    volumes:
      - ./logs/backend:/app/logs
    networks:
      - job-ai-network
    depends_on:
      - postgres
  
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: job-ai-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 如果需要 SSL 证书
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - job-ai-network
  
  postgres:
    image: postgres:15-alpine
    container_name: job-ai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - job-ai-network

volumes:
  postgres-data:

networks:
  job-ai-network:
    driver: bridge