# Docker Compose 配置文件
# 用于在生产环境中部署求职追踪助手
# 使用镜像仓库部署，不需要在服务器上构建

version: '3.8'

services:
  # 后端服务
  backend:
    image: ccr.ccs.tencentyun.com/your-namespace/job-ai-backend:main
    container_name: job-ai-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - ./backend/.env
    external_links:
      - postgres:postgres  # 链接到 1Panel 的 PostgreSQL 容器
    networks:
      - job-ai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 前端服务
  frontend:
    image: ccr.ccs.tencentyun.com/your-namespace/job-ai-frontend:main
    container_name: job-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - job-ai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  job-ai-network:
    external: true  # 使用外部网络（需要先创建）

# volumes:
#   如果需要使用 Docker 容器的 PostgreSQL，可以取消注释以下配置
#   postgres-data:
