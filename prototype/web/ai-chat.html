<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手 - 求职追踪助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --secondary: #3B82F6;
            --cta: #F97316;
            --background: #F8FAFC;
            --text: #1E293B;
            --border: #E2E8F0;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--background);
            color: var(--text);
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }
        .chat-container {
            height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .message-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        secondary: '#3B82F6',
                        cta: '#F97316',
                        background: '#F8FAFC',
                        text: '#1E293B',
                        border: '#E2E8F0',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-background">
    <!-- Header -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-card shadow-sm">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Back Button -->
                <button onclick="window.location.href='ai-assistant-guide.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>

                <!-- Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 21v-5.016M12 14.984v-.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <h1 class="text-lg font-semibold font-['Poppins']">AI 求职助手</h1>
                        <span class="flex items-center text-xs text-green-500 font-medium">
                            <span class="w-2 h-2 rounded-full bg-green-500 mr-1"></span>
                            在线
                        </span>
                    </div>
                </div>

                <!-- History Button -->
                <button onclick="window.location.href='ai-history.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Chat Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-20">
        <div class="chat-container py-6 space-y-6" id="chatContainer">
            <!-- AI Welcome Message -->
            <div class="flex items-start space-x-3 message-enter">
                <div class="w-9 h-9 rounded-full bg-primary flex-shrink-0"></div>
                <div class="max-w-[600px] space-y-2">
                    <div class="bg-white border border-border rounded-2xl rounded-tl-none p-4 shadow-sm">
                        <p class="text-base text-text leading-relaxed">你好！我是你的AI求职助手 👋</p>
                        <p class="text-base text-text leading-relaxed">我可以帮你进行岗位匹配度分析、简历优化、面试准备和技能梳理。</p>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="space-y-3 message-enter">
                <p class="text-sm font-semibold text-gray-600 px-1">快速开始</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <button onclick="sendQuickMessage('match')" class="flex items-center p-3 bg-white border border-border rounded-xl hover:border-primary hover:shadow-md transition-all duration-200 group">
                        <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mr-3 flex-shrink-0">
                            <span class="text-xl">📊</span>
                        </div>
                        <div class="flex-1 text-left">
                            <p class="font-semibold text-sm text-text">岗位匹配度分析</p>
                            <p class="text-xs text-gray-500">上传JD分析匹配度</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors duration-200 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7"></path>
                        </svg>
                    </button>

                    <button onclick="sendQuickMessage('resume')" class="flex items-center p-3 bg-white border border-border rounded-xl hover:border-orange-500 hover:shadow-md transition-all duration-200 group">
                        <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center mr-3 flex-shrink-0">
                            <span class="text-xl">📝</span>
                        </div>
                        <div class="flex-1 text-left">
                            <p class="font-semibold text-sm text-text">简历优化</p>
                            <p class="text-xs text-gray-500">优化简历措辞结构</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-cta transition-colors duration-200 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="fixed bottom-0 left-0 right-0 bg-background border-t border-border p-4">
            <div class="max-w-4xl mx-auto">
                <div class="flex items-center space-x-3">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="输入消息..."
                        class="flex-1 px-5 py-3 bg-white border border-border rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                        onkeypress="if(event.key === 'Enter') sendMessage()"
                    >
                    <button
                        onclick="sendMessage()"
                        class="w-12 h-12 bg-primary text-white rounded-full hover:bg-secondary shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center flex-shrink-0"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5M5 12l7-7 7 7"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 移动端底部导航 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-border md:hidden">
        <div class="flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012-2V5a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012 2m14 0a2 2 0 01-2 2v-4a2 2 0 00-2-2M9 7h.01"></path>
                </svg>
                <span class="text-xs mt-1">岗位</span>
            </a>
            <a href="interviews.html" class="flex flex-col items-center justify-center text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <span class="text-xs mt-1">面经</span>
            </a>
            <a href="summaries.html" class="flex flex-col items-center justify-center text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                <span class="text-xs mt-1">总结</span>
            </a>
            <a href="ai-chat.html" class="flex flex-col items-center justify-center text-primary">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 21v-5.016M12 14.984v-.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-xs mt-1">AI助手</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center justify-center text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span class="text-xs mt-1">我的</span>
            </a>
        </div>
    </nav>

    <script>
        const chatContainer = document.getElementById('chatContainer');

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // 添加用户消息
            addUserMessage(message);

            // 清空输入框
            input.value = '';

            // 模拟AI回复
            setTimeout(() => {
                addAIMessage(getAIResponse(message));
            }, 1000);
        }

        // 添加用户消息
        function addUserMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start space-x-3 justify-end message-enter';
            messageDiv.innerHTML = `
                <div class="max-w-[500px] space-y-2">
                    <div class="bg-primary text-white rounded-2xl rounded-tr-none p-4 shadow-sm">
                        <p class="text-base leading-relaxed">${message}</p>
                    </div>
                </div>
                <div class="w-9 h-9 rounded-full bg-cta flex-shrink-0"></div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // 添加AI消息
        function addAIMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start space-x-3 message-enter';
            messageDiv.innerHTML = `
                <div class="w-9 h-9 rounded-full bg-primary flex-shrink-0"></div>
                <div class="max-w-[600px] space-y-2">
                    <div class="bg-white border border-border rounded-2xl rounded-tl-none p-4 shadow-sm">
                        <p class="text-base text-text leading-relaxed">${message}</p>
                    </div>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // 滚动到底部
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 快捷消息
        function sendQuickMessage(type) {
            let message = '';
            switch(type) {
                case 'match':
                    message = '帮我分析一下字节跳动前端工程师的岗位匹配度';
                    break;
                case 'resume':
                    message = '帮我优化我的简历';
                    break;
                default:
                    message = '我想了解' + type;
            }
            addUserMessage(message);

            setTimeout(() => {
                addAIMessage(getAIResponse(message));
            }, 1000);
        }

        // AI响应
        function getAIResponse(userMessage) {
            if (userMessage.includes('匹配度') || userMessage.includes('分析')) {
                return '好的！请粘贴岗位JD，我会从技能、经验、学历、薪资四个维度为您分析匹配度，并给出具体的改进建议。';
            } else if (userMessage.includes('简历') || userMessage.includes('优化')) {
                return '我来帮您优化简历。请上传您的简历内容，我会逐句分析并给出优化建议，包括措辞改进和结构优化。';
            } else if (userMessage.includes('面试')) {
                return '我会为您预测可能的面试问题，并生成准备清单。您要准备哪个岗位的面试？';
            } else {
                return '收到！我可以帮您进行岗位匹配度分析、简历优化、面试准备或技能梳理，请问需要哪方面的帮助？';
            }
        }

        // 页面加载时检查URL参数
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');

            if (type) {
                sendQuickMessage(type);
            }
        }
    </script>
</body>
</html>
