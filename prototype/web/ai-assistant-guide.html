<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手引导页 - 求职追踪助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --secondary: #3B82F6;
            --cta: #F97316;
            --background: #F8FAFC;
            --text: #1E293B;
            --border: #E2E8F0;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--background);
            color: var(--text);
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        secondary: '#3B82F6',
                        cta: '#F97316',
                        background: '#F8FAFC',
                        text: '#1E293B',
                        border: '#E2E8F0',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-card shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <span class="text-xl font-semibold font-['Poppins']">求职助手</span>
                </div>

                <!-- 跳过按钮 -->
                <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-lg hover:bg-gray-50 transition-colors duration-200">
                    <span class="text-sm font-medium text-gray-600">跳过</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="pt-20 pb-8">
        <!-- Hero Section -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
            <div class="text-center mb-16 space-y-6">
                <!-- Badge -->
                <div class="inline-flex items-center space-x-2 px-4 py-1.5 bg-blue-100 rounded-full">
                    <span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
                    <span class="text-sm font-semibold text-primary tracking-wide">AI 智能助手</span>
                </div>

                <!-- Title -->
                <h1 class="text-5xl md:text-6xl font-bold font-['Poppins'] text-text mb-4">
                    让AI成为你的求职顾问
                </h1>

                <!-- Subtitle -->
                <p class="text-xl text-gray-500 font-['Open Sans']">
                    四大AI功能全程陪伴，助你拿到理想offer
                </p>
            </div>

            <!-- 功能卡片网格 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-20">
                <!-- 卡片1: 岗位匹配度分析 -->
                <div class="bg-white rounded-xl p-6 border border-border hover:shadow-lg transition-shadow duration-200 cursor-pointer" onclick="window.location.href='ai-chat.html?type=match'">
                    <div class="mb-4">
                        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mb-4">
                            <span class="text-2xl">📊</span>
                        </div>
                        <h3 class="text-lg font-semibold font-['Poppins'] text-text mb-2">
                            岗位匹配度分析
                        </h3>
                        <p class="text-sm text-gray-500 leading-relaxed">
                            AI深度解析JD，多维度评估匹配度
                        </p>
                    </div>
                    <button class="w-full py-2.5 bg-primary text-white rounded-lg hover:bg-secondary transition-colors duration-200 font-medium text-sm">
                        立即体验
                    </button>
                </div>

                <!-- 卡片2: 简历优化 -->
                <div class="bg-white rounded-xl p-6 border border-border hover:shadow-lg transition-shadow duration-200 cursor-pointer" onclick="window.location.href='ai-chat.html?type=resume'">
                    <div class="mb-4">
                        <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center mb-4">
                            <span class="text-2xl">📝</span>
                        </div>
                        <h3 class="text-lg font-semibold font-['Poppins'] text-text mb-2">
                            简历优化
                        </h3>
                        <p class="text-sm text-gray-500 leading-relaxed">
                            逐句分析优化措辞，突出核心优势
                        </p>
                    </div>
                    <button class="w-full py-2.5 bg-cta text-white rounded-lg hover:bg-orange-600 transition-colors duration-200 font-medium text-sm">
                        立即体验
                    </button>
                </div>

                <!-- 卡片3: 面试准备 -->
                <div class="bg-white rounded-xl p-6 border border-border hover:shadow-lg transition-shadow duration-200 cursor-pointer" onclick="window.location.href='ai-chat.html?type=interview'">
                    <div class="mb-4">
                        <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center mb-4">
                            <span class="text-2xl">💼</span>
                        </div>
                        <h3 class="text-lg font-semibold font-['Poppins'] text-text mb-2">
                            面试准备
                        </h3>
                        <p class="text-sm text-gray-500 leading-relaxed">
                            预测面试问题，生成准备清单
                        </p>
                    </div>
                    <button class="w-full py-2.5 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200 font-medium text-sm">
                        立即体验
                    </button>
                </div>

                <!-- 卡片4: 技能梳理 -->
                <div class="bg-white rounded-xl p-6 border border-border hover:shadow-lg transition-shadow duration-200 cursor-pointer" onclick="window.location.href='ai-chat.html?type=skills'">
                    <div class="mb-4">
                        <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center mb-4">
                            <span class="text-2xl">🎯</span>
                        </div>
                        <h3 class="text-lg font-semibold font-['Poppins'] text-text mb-2">
                            技能梳理
                        </h3>
                        <p class="text-sm text-gray-500 leading-relaxed">
                            构建技能树，识别差距推荐学习
                        </p>
                    </div>
                    <button class="w-full py-2.5 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-colors duration-200 font-medium text-sm">
                        立即体验
                    </button>
                </div>
            </div>

            <!-- CTA Section -->
            <div class="text-center space-y-4">
                <button onclick="window.location.href='ai-chat.html'" class="px-12 py-4 bg-primary text-white rounded-xl hover:bg-secondary shadow-md hover:shadow-lg transition-all duration-200 font-semibold text-lg">
                    开始使用AI助手
                </button>
                <p class="text-sm text-gray-400">
                    已有 50,000+ 用户正在使用
                </p>
            </div>
        </section>
    </main>

    <!-- 移动端底部导航 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-border md:hidden">
        <div class="flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center text-primary">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012-2V5a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012 2m14 0a2 2 0 01-2 2v-4a2 2 0 00-2-2M9 7h.01"></path>
                </svg>
                <span class="text-xs mt-1">岗位</span>
            </a>
            <a href="interviews.html" class="flex flex-col items-center justify-center text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <span class="text-xs mt-1">面经</span>
            </a>
            <a href="summaries.html" class="flex flex-col items-center justify-center text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                <span class="text-xs mt-1">总结</span>
            </a>
            <a href="ai-chat.html" class="flex flex-col items-center justify-center text-primary">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 21v-5.016M12 14.984v-.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-xs mt-1">AI助手</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center justify-center text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span class="text-xs mt-1">我的</span>
            </a>
        </div>
    </nav>
</body>
</html>
